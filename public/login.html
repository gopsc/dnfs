<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191a18">
    <title>登录 — DNFS 树状笔记</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <header class="header">
        <div class="wrap header-inner">
            <a class="brand" href="index.html" aria-label="DNFS 树状笔记首页">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6v12M7 12h10V6"/><circle cx="7" cy="5" r="2"/><circle cx="17" cy="5" r="2"/><circle cx="7" cy="19" r="2"/></svg>
                </span>
                <span class="brand-name">DNFS<span class="brand-caption">树状笔记</span></span>
            </a>
            <nav class="auth-switch" aria-label="账号导航">
                <span>还没有账号？</span>
                <button type="button" id="registerBtn" class="btn btn-ghost">注册</button>
            </nav>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-panel">
            <div class="auth-heading">
                <p class="section-eyebrow">回到你的知识树</p>
                <h1>欢迎回来。</h1>
                <p class="auth-description">登录后，继续记录与连接。</p>
            </div>
            <form id="form" class="auth-form" novalidate>
                <div class="auth-field">
                    <label for="loginUsername">邮箱</label>
                    <input type="text" id="loginUsername" placeholder="请输入邮箱" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="msgTip">
                    <span id="msgTip" aria-live="polite"></span>
                </div>
                <div class="auth-field">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" aria-describedby="pwdTip">
                    <span id="pwdTip" aria-live="polite"></span>
                </div>
                <div class="auth-field">
                    <div class="auth-field-label"><label for="captchaAnswer">图形验证码</label><span>点击图片换一张</span></div>
                    <div class="auth-code-row">
                        <input type="text" id="captchaAnswer" placeholder="图中字符" maxlength="4" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="captchaTip">
                        <img id="captchaImg" class="auth-captcha" alt="加载中…" title="点击刷新验证码" role="button" tabindex="0" onkeydown="if(event.key === 'Enter' || event.key === ' '){event.preventDefault();this.click();}">
                    </div>
                    <span id="captchaTip" aria-live="polite"></span>
                </div>
                <div class="auth-agreement">
                    <label id="agreement" for="agreeBox"><input type="checkbox" id="agreeBox" name="agree" value="access" aria-describedby="agreeTip"><span>我已阅读并同意</span></label>
                    <a id="agreementLink" href="LICENSE.html" rel="noopener">《用户使用条例》</a>
                    <span id="agreeTip" aria-live="polite"></span>
                </div>
                <input type="submit" id="loginBtn" class="auth-submit" value="登录">
                <div class="auth-secondary">
                    <input type="reset" id="resetUser" value="重置">
                    <a href="forgot.html">忘记密码？</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer auth-footer">
        <p>让知识自然成体系。</p>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2024107064号-2</a>
    </footer>

    <div id="licenseModal" class="license-modal-overlay" style="display:none">
        <div class="license-modal-box" role="dialog" aria-modal="true" aria-labelledby="licenseTitle">
            <div class="license-modal-header"><h2 id="licenseTitle">用户使用条例</h2><button id="licenseClose" class="license-modal-close" aria-label="关闭">&times;</button></div>
            <iframe id="licenseFrame" src="about:blank" title="用户使用条例"></iframe>
        </div>
    </div>
    <script src="js/validation.js"></script>
    <script src="js/login.js"></script>
    <script>
        (function(){
            var link = document.getElementById('agreementLink');
            var modal = document.getElementById('licenseModal');
            var frame = document.getElementById('licenseFrame');
            var close = document.getElementById('licenseClose');
            function show(){
                frame.src = 'LICENSE.html?embedded=1';
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
            function hide(){
                modal.style.display = 'none';
                frame.src = 'about:blank';
                document.body.style.overflow = '';
            }
            link.addEventListener('click', function(e){ e.preventDefault(); show(); });
            close.addEventListener('click', hide);
            modal.addEventListener('click', function(e){ if(e.target === modal) hide(); });
        })();
    </script>
</body>
</html>
