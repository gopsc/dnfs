<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdf6ee">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1712">
    <title>DNFS 树状笔记</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fdf6ee;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1e1712; color: #e8ddd0; }
        }
        .loading {
            text-align: center;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #b8956a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="loading-spinner"></div>
        <p>正在加载 DNFS 树状笔记...</p>
    </div>
    <script>
        // Capacitor 会通过 server.url 加载远程内容
        // 这个页面只是作为 fallback
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.location.href = 'https://qsont.me';
            }, 100);
        });
    </script>
</body>
</html>
